# Host networking (Linux): the container shares the host's network stack, so probes, the Egress
# page, and the Host page's interfaces, routes, and DNS all describe the host itself.
#
#   docker compose -f compose.host.yaml up -d --build
#
# The port is set with NETPROBE_PORT, since nothing is published. Docker Desktop on macOS and
# Windows runs containers in a VM, where host networking means the VM's network, not yours.
services:
  netprobe:
    build: .
    image: netprobe:latest
    init: true
    restart: unless-stopped
    network_mode: host
    environment:
      NETPROBE_PORT: ${NETPROBE_PORT:-8080}
      NETPROBE_HOST: ${NETPROBE_HOST:-0.0.0.0}
      NETPROBE_DOCKER_NETWORK: host
      NETPROBE_HOST_LABEL: ${NETPROBE_HOST_LABEL:-}
    volumes:
      - netprobe-data:/data
      - ./config:/config:ro
      # Lets the Host page report the host's OS instead of the image's.
      - /etc/os-release:/host/os-release:ro

volumes:
  netprobe-data:
