# Bridge networking: portable, works with Docker Desktop. Traffic leaves through Docker's NAT, so
# on Linux prefer compose.host.yaml when you want measurements identical to the host's.
#
#   docker compose pull && docker compose up -d     (or `up -d --build` to build locally)
services:
  netprobe:
    # Prebuilt multi-arch image from CI; `up --build` builds from this checkout instead.
    image: ${NETPROBE_IMAGE:-ghcr.io/lennondotw/netprobe:latest}
    build: .
    init: true
    restart: unless-stopped
    ports:
      - '${NETPROBE_PUBLISH_PORT:-8080}:8080'
    environment:
      NETPROBE_DOCKER_NETWORK: bridge
      # Shown in the UI and stored with every run; defaults to the container hostname.
      NETPROBE_HOST_LABEL: ${NETPROBE_HOST_LABEL:-}
    volumes:
      - netprobe-data:/data
      # Optional: put netprobe.yaml here. Without it only the built-in presets are used.
      - ./config:/config:ro

volumes:
  netprobe-data:
