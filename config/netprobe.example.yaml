# yaml-language-server: $schema=./netprobe.schema.json
#
# Netprobe configuration. Copy to config/netprobe.yaml and edit; every key is optional.
# With the YAML extension in VS Code (or any editor using yaml-language-server), the line above
# gives completion, hover docs, and validation from netprobe.schema.json in this folder.

# Name shown in the UI and stored with each run. Defaults to the hostname.
# hostLabel: build-runner

# Optional parts of Netprobe.
modules:
  downloads: false # throughput tests: about 50 MB per run against speed-test hosts
  host: true # Host page: system, interfaces, routes, DNS, proxies — visible on the LAN
  # Egress page: asks third-party services about this host's public addresses.
  # Use true / false, or settings:
  egress:
    excludeSources: [] # e.g. [ip-api, ipinfo]
    reputation: true # proxycheck.io lookups for each exit address
    dnsLeakTest: true # bash.ws leak test
    browserCheck: true # WebRTC check for the browser viewing the page

probe:
  repeats: 5 # default attempts per target
  connectTimeoutMs: 5000
  timeoutMs: 15000
  concurrency: 8 # targets probed in parallel (downloads always run one at a time)

download:
  connections: 4 # connections for the parallel (range-split) measurement
  timeoutMs: 120000
  maxBytes: 209715200 # requests for anything larger are aborted

ipFamily: auto # auto | ipv4 | ipv6 — default for runs; each run can override it

# Network exits to compare; the first is the default. Proxy credentials never reach the UI or logs.
exits:
  - id: direct
    name: Direct
  # - id: office-proxy
  #   name: Office proxy
  #   proxy: socks5h://10.0.0.2:1080 # socks5h resolves DNS on the proxy; socks5 resolves locally
  # - id: http-proxy
  #   name: HTTP proxy
  #   proxy: http://user:password@proxy.internal:3128
  # Network-layer exits (Linux, in Docker with NET_ADMIN): no proxy settings involved.
  # - id: side-router
  #   name: Side router
  #   gateway: 192.168.1.240 # a gateway on a network the container is attached to
  #   dns: 192.168.1.240 # optional: resolve through it as well
  # - id: wireguard
  #   name: WireGuard
  #   interface: wg0

# Built-in services. Completion lists every id.
presets:
  enabled: true # false starts from no built-in services at all
  exclude: [] # services ("social") or single targets ("github.objects")
  excludeCategories: [] # e.g. [Regional]

