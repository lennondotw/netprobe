# Copy to config/netprobe.yaml and edit. Every key is optional; without a config file the
# built-in presets run over a direct connection.

# Label shown in the UI and stored with each run. Defaults to the hostname.
# hostLabel: build-runner

probe:
  repeats: 5 # attempts per target in a quick run
  connectTimeoutMs: 5000
  timeoutMs: 15000
  concurrency: 8 # targets probed in parallel (downloads always run one at a time)

download:
  connections: 4 # connections for the parallel (range-split) measurement
  timeoutMs: 120000
  maxBytes: 209715200 # requests for anything larger are aborted

# auto | ipv4 | ipv6 — the default in the UI; each run can override it.
ipFamily: auto

# Endpoint that echoes the public IP, as `ip=` lines or a bare address.
egressCheckUrl: https://www.cloudflare.com/cdn-cgi/trace

# Network exits to compare. The first entry is the default. Proxy credentials stay on the
# server; the UI only shows scheme, host, and port.
egress:
  - id: direct
    name: Direct
  # - id: office-proxy
  #   name: Office proxy
  #   # socks5h resolves DNS on the proxy; socks5 resolves locally. Results can differ.
  #   proxy: socks5h://10.0.0.2:1080
  # - id: http-proxy
  #   name: HTTP proxy
  #   proxy: http://user:password@proxy.internal:3128

presets:
  # Hide built-in services by id. Network: latency, connectivity, udp, reference.
  # DNS: dns-plain, dns-encrypted. Platforms: apple, microsoft, google, cloudflare.
  # Developer: github, github-actions, registries, code-hosting, apple-notary, npm.
  # Cloud: aws, vercel. Tailscale: tailscale, tailscale-derp.
  # Social & tools: social, collaboration. Regional: china.
  exclude: []

# Add services, or targets to a built-in service by reusing its id.
# Besides http(s), a target URL can use these schemes. Socket probes only run on a direct egress.
#   icmp://1.1.1.1                                   ping (set `samples` for more echoes)
#   tcp://host:443                                   TCP connect
#   dns://8.8.8.8?name=example.com&type=A            one query over UDP
#   dot://1.1.1.1?name=example.com&sni=cloudflare-dns.com   DNS over TLS
#   stun://stun.l.google.com:19302                   STUN binding, reports the public UDP address
#   quic://dns.adguard-dns.com:853                   QUIC version negotiation (UDP reachability)
